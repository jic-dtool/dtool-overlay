[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dtool-overlay"
description = "dtool CLI utilities for working with per item metadata"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.rst"]
authors = [
    {name = "Tjelvar Olsson", email = "tjelvar.olsson@gmail.com"},
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "dtoolcore",
    "parse",
    "click",
    "dtool-cli>=0.7.2",
]

[project.urls]
Repository = "https://github.com/jic-dtool/dtool-overlay"

[project.entry-points."dtool.cli"]
overlays = "dtool_overlay.cli:overlays"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["dtool_overlay"]
